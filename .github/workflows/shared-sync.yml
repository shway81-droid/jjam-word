# ===================================================================
# 상류(jjam)와 공통 파일이 어긋났는지 확인한다
# ===================================================================
# 짬짬이 사이트들은 저장소가 갈라져 있지만 헤더의 자매 사이트 바로가기와 웹폰트는
# 글자 하나까지 같아야 한다. 한쪽만 고치면 사이트마다 다른 글씨체·다른 바로가기가
# 된다. 그런데 이탈은 **이 저장소에서 아무 일이 없어도** 생긴다 — 상류가 바뀌면
# 가만히 있는 쪽이 어긋난다. 그래서 PR 때만이 아니라 매일 한 번 확인한다.
#
# 고치는 법은 실패 로그가 알려 준다 (`npm run sync:shared`).
# ===================================================================

name: shared-sync

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 매일 21:00 UTC = 06:00 KST. 자매 저장소와 같은 시각에 확인한다.
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: shared-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 의존성이 필요 없는 스크립트라 npm ci 를 건너뛴다 (node 내장 모듈만 쓴다).
      - run: npm run sync:check
